<template>
    <!-- Main List View -->
    <template if:true={showListView}>
        <lightning-card class="main-container">
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <!-- Add Back Button -->
                        <lightning-button-icon icon-name="utility:back" alternative-text="Back to Yearly Budget"
                            onclick={handleBackToYearlyBudget} class="slds-m-right_small">
                        </lightning-button-icon>
                        <h1 class="slds-text-heading_large slds-text-color_default">
                            Departmental Budget Allocation
                        </h1>
                    </div>
                    <lightning-button label="Add New Budget" variant="brand"
                        onclick={handleAddNewBudget}></lightning-button>
                </div>
            </div>

            <div class="slds-grid slds-wrap slds-p-around_medium slds-grid_align-stretch">

                <!-- LEFT PANEL -->
                <div class="slds-col slds-size_1-of-2">
                    <div class="slds-box slds-theme_default slds-m-bottom_medium slds-p-around_none">
                        <div class="header-section">
                            <div class="slds-grid slds-grid_align-spread">
                                <div class="dept-info">
                                    <div class="dept-name"><strong>{yearlyBudgetName}</strong></div>
                                </div>
                            </div>
                        </div>
                        <div class="custom-body-padding">
                            <div class="slds-grid slds-wrap">
                                <div class="slds-col slds-size_1-of-2">
                                    <p class="slds-m-bottom_small"><strong>Financial Year:</strong> {fiscalYear}</p>
                                    <p class="slds-m-bottom_small"><strong>Start Date:</strong> {startDate}</p>
                                    <p><strong>End Date:</strong> {endDate}</p>
                                </div>

                                <div class="slds-col slds-size_1-of-2">
                                    <p class="slds-m-bottom_small"><strong>Budget Amount:</strong> ₹{budgetAmount}</p>
                                    <p class="slds-m-bottom_small"><strong>Utilized Budget:</strong> ₹{utilizedBudget}
                                    </p>
                                    <p><strong>Percentage:</strong> {utilizedPercentage}%</p>
                                </div>
                            </div>
                        </div>
                        <lightning-button label="Budget Objective and Outcome" variant="base"
                            onclick={handleOpenObjectiveModal} class="custom-body-padding slds-p-top_medium">
                        </lightning-button>
                    </div>
                </div>

                <!-- RIGHT PANEL -->
                <div class="slds-col slds-size_1-of-2 slds-p-left_medium">
                    <div class="uniform-chart-container">
                        <div class="uniform-chart-card">
                            <div class="chart-circle given">
                                <div class="chart-inner">
                                    <div class="chart-amount">₹{budgetAmount}</div>
                                </div>
                            </div>
                            <div class="chart-title">Budget Given</div>
                        </div>
                        <div class="uniform-chart-card">
                            <div class="chart-circle utilized">
                                <div class="chart-inner">
                                    <div class="chart-amount">₹{utilizedBudget}</div>
                                </div>
                            </div>
                            <div class="chart-title">Utilized Budget</div>
                        </div>
                        <div class="uniform-chart-card">
                            <div class="chart-circle percentage">
                                <div class="chart-inner">
                                    <div class="chart-amount">{utilizedPercentage}%</div>
                                </div>
                            </div>
                            <div class="chart-title">Utilized Budget %</div>
                        </div>
                    </div>
                </div>
            </div>


            <!-- Loading Spinner -->
            <template if:true={showSpinner}>
                <div class="slds-p-around_large">
                    <div class="slds-text-align_center">
                        <lightning-spinner alternative-text="Loading departmental budget data..." size="medium"
                            class="slds-m-bottom_small">
                        </lightning-spinner>
                        <p class="slds-text-body_regular slds-text-color_weak">
                            Loading departmental budget data...
                        </p>
                    </div>
                </div>
            </template>


            <!-- Show table only if records exist and not loading -->
            <template if:true={hasRecords}>
                <template if:false={showSpinner}>
                    <div class="slds-p-around_medium table-container">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th class="slds-text-align_center"
                                        style="background-color: #0070d2; color: white; border-right: 1px solid white;">
                                        Name
                                    </th>
                                    <th class="slds-text-align_center"
                                        style="background-color: #0070d2; color: white; border-right: 1px solid white;">
                                        Department</th>
                                    <th class="slds-text-align_center"
                                        style="background-color: #0070d2; color: white; border-right: 1px solid white;">
                                        Financial Year</th>
                                    <th class="slds-text-align_center"
                                        style="background-color: #0070d2; color: white; border-right: 1px solid white;">
                                        Start
                                        Date</th>
                                    <th class="slds-text-align_center"
                                        style="background-color: #0070d2; color: white; border-right: 1px solid white;">
                                        End Date
                                    </th>
                                    <th class="slds-text-align_center"
                                        style="background-color: #0070d2; color: white; border-right: 1px solid white;">
                                        Total
                                        Budget (₹)</th>
                                    <th class="slds-text-align_center"
                                        style="background-color: #0070d2; color: white; border-right: 1px solid white;">
                                        Utilized
                                        Budget (₹)</th>
                                    <th class="slds-text-align_center"
                                        style="background-color: #0070d2; color: white; border-right: 1px solid white;">
                                        %
                                        Utilized</th>
                                    <th class="slds-text-align_center"
                                        style="background-color: #0070d2; color: white; width: 80px;">Action</th>
                                </tr>
                            </thead>
                            <tbody class="slds-text-align_center">
                                <template for:each={budgetList} for:item="item">
                                    <tr key={item.id}>
                                        <td style="text-align: center; vertical-align: middle;">{item.name}</td>
                                        <td style="text-align: center; vertical-align: middle;">{item.department}</td>
                                        <td style="text-align: center; vertical-align: middle;">{item.fiscalYear}</td>
                                        <td style="text-align: center; vertical-align: middle;">{item.startDate}</td>
                                        <td style="text-align: center; vertical-align: middle;">{item.endDate}</td>
                                        <td style="text-align: center; vertical-align: middle;">₹{item.totalBudget}</td>
                                        <td style="text-align: center; vertical-align: middle;">₹{item.utilizedBudget}
                                        </td>
                                        <td style="text-align: center; vertical-align: middle;">
                                            {item.utilizedpercentage}%</td>
                                        <td>
                                            <lightning-button-icon icon-name="utility:chevronright"
                                                alternative-text="View Details" data-id={item.id}
                                                onclick={handleViewDetails}>
                                            </lightning-button-icon>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>

                <!-- Charts Section -->
            <div class="charts-container slds-p-around_medium">
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                        <div class="chart-card">
                            <div class="chart-wrapper">
                                <c-department-performance-chart
                                    record-id={yearlyBudgetId}></c-department-performance-chart>
                            </div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                        <div class="chart-card">
                            <div class="chart-wrapper">
                                <c-sub-department-pie-chart record-id={yearlyBudgetId}></c-sub-department-pie-chart>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </template>

            <!-- Show no records message when no data and not loading -->
            <template if:false={hasRecords}>
                <template if:false={showSpinner}>
                    <div class="slds-p-around_medium">
                        <div class="slds-text-align_center slds-p-vertical_xx-large">
                            <lightning-icon icon-name="utility:info" alternative-text="No Records"
                                class="slds-icon_large slds-icon-text-default slds-m-bottom_small">
                            </lightning-icon>
                            <p class="slds-text-heading_medium slds-text-color_weak">
                                No departmental budget for {currentFiscalYear}
                            </p>
                        </div>
                    </div>
                </template>
            </template>

            
        </lightning-card>

        <!-- Modal for Add New Budget -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container custom-modal-size ">
                    <!-- Modal Header -->
                    <header class="slds-modal__header custom-modal-header">
                        <div class="title-with-icon">
                            <span class="icon-circle">
                                <lightning-icon icon-name="utility:edit" alternative-text="Edit" class="blue-icon"
                                    size="small">
                                </lightning-icon>
                            </span>
                            <h2 class="slds-modal__title slds-text-heading_medium slds-text-color_inverse">
                                Add Departmental Budget
                            </h2>
                        </div>
                    </header>

                    <!-- Modal Body -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={isFirstStep}>
                            <div>
                                <lightning-input label="Departmental Budget" required value={newBudget.name}
                                    onchange={handleInputChange} data-field="name"></lightning-input>
                            </div>
                            <!-- Replace your existing Department combobox with this -->
                            <div>
                                <lightning-combobox label="Department" required value={newBudget.departmentId}
                                    options={departmentOptions} onchange={handleInputChange} data-field="departmentId"
                                    placeholder="Select Department or Add New">
                                </lightning-combobox>
                            </div>
                            <div class="custom-readonly-field">
                                <label class="slds-form-element__label">Yearly Budget</label>
                                <div class="readonly-box">{yearlyBudgetDisplayValue}</div>
                            </div>
                            <div class="custom-readonly-field">
                                <label class="slds-form-element__label">Available Budget (₹)</label>
                                <div class="readonly-box">{availableBudgetDisplay}</div>
                            </div>
                            <div>
                                <lightning-input type="number" required label="Amount" value={newBudget.amount} min="0"
                                    max={availableBudget} onchange={handleInputChange}
                                    data-field="amount"></lightning-input>
                            </div>
                        </template>

                        <template if:false={isFirstStep}>
                            <div class="slds-grid slds-wrap slds-gutters slds-p-around_small">
                                <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                    <div class="slds-form-element required-field">
                                        <label class="slds-form-element__label">Budget Objective</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input-rich-text value={newBudget.objective}
                                                onchange={handleInputChange} data-field="objective">
                                            </lightning-input-rich-text>
                                        </div>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                    <div class="slds-form-element required-field">
                                        <label class="slds-form-element__label">Expected Outcome</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input-rich-text value={newBudget.outcome}
                                                onchange={handleInputChange} data-field="outcome">
                                            </lightning-input-rich-text>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Modal Footer -->
                    <footer class="slds-modal__footer slds-p-around_medium slds-text-align_center">
                        <lightning-button label="Cancel" onclick={handleModalCancel}></lightning-button>

                        <template if:false={isFirstStep}>
                            <lightning-button label="Back" onclick={handleBack}
                                class="slds-m-left_x-small"></lightning-button>
                        </template>

                        <lightning-button label={nextOrSaveLabel} variant="brand" onclick={handleNextOrSave}
                            class="slds-m-left_x-small" type="button"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </template>

    <!-- Detail View Component -->
    <template if:true={showDetailView}>
        <c-budget-detail-view budget-id={selectedBudgetId} onbacktolist={handleBackToList}>
        </c-budget-detail-view>
    </template>

    <!-- Modal for Budget Objective and Outcome -->
    <template if:true={isObjectiveModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container custom-modal-size">

                <!-- Update the modal header -->
                <header class="slds-modal__header custom-modal-header">
                    <h2
                        class="slds-modal__title slds-text-heading_medium slds-text-color_inverse slds-text-align_center">
                        Yearly Budget Objective and Outcome
                    </h2>
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare-inverse"
                        size="large" onclick={handleCloseObjectiveModal} class="close-button-right">
                    </lightning-button-icon>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <!-- Budget Objective -->
                        <div class="slds-col slds-size_1-of-2">
                            <div class="slds-form-element">
                                <label class="slds-form-element__label objective-outcome-label">
                                    Budget Objective
                                </label>
                                <div class="slds-form-element__control">
                                    <div class="readonly-rich-text-container" lwc:dom="manual" data-field="objective">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Expected Outcome -->
                        <div class="slds-col slds-size_1-of-2">
                            <div class="slds-form-element">
                                <label class="slds-form-element__label objective-outcome-label">
                                    Expected Outcome
                                </label>
                                <div class="slds-form-element__control">
                                    <div class="readonly-rich-text-container" lwc:dom="manual" data-field="outcome">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>


    <!-- Add Department Modal - Add this at the end of your template -->
    <c-add-department-modal is-open={showAddDepartmentModal} onclose={handleCloseDepartmentModal}
        ondepartmentsaved={handleDepartmentSaved}>
    </c-add-department-modal>
</template>
