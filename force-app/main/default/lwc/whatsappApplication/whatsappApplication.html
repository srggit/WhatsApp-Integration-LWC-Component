<template>
    <div class={containerClass}>
        <!-- Left Panel - Contact List -->
        <div class="left-panel">
            <!-- Header -->
            <div class="panel-header">
                <div class="user-profile">
                    <div class="avatar-large">
                        <lightning-icon icon-name="standard:whatsapp" size="large"></lightning-icon>
                    </div>

                    <div class="user-info">
                        <div class="username">WhatsApp Business</div>
                        <div class="user-status">Online</div>
                    </div>

                    <div class="header-icons">
                        <button class="icon-button" type="button" onclick={handleGroupsClick} title="Groups">
                            <lightning-icon icon-name="standard:groups" size="x-small"></lightning-icon>
                        </button>

                        <button class="icon-button" type="button" onclick={toggleTheme} title="Toggle theme">

                            <template if:true={isDarkMode}>
                                ☀️
                            </template>

                            <template if:false={isDarkMode}>
                                🌙
                            </template>

                        </button>

                        <button class="icon-button" type="button" title="Settings">
                            <lightning-icon icon-name="utility:settings" size="x-small"></lightning-icon>
                        </button>
                    </div>
                </div>

                <!-- Search/Filter Bar -->
                <div class="search-container">
                    <lightning-input type="search" placeholder="Search by name or number..." value={searchTerm}
                        onchange={handleSearchChange} variant="label-hidden">
                    </lightning-input>
                </div>

                <!-- Teams / Categories -->
                <div class="teams-section">
                    <div class="chats-count">
                        <span>Chats</span>
                        <strong>{filteredContacts.length}</strong>
                    </div>
                </div>

                <!-- Contact List -->
                <div class="contact-list">
                    <template for:each={filteredContacts} for:item="contact">
                        <div key={contact.Id} class={contact.cssClass} data-id={contact.Id}
                            onclick={handleContactSelect}>

                            <!-- Selection Checkbox for Bulk -->
                            <div class="contact-checkbox" if:true={showCheckboxesForBulk}>
                                <lightning-input type="checkbox" checked={contact.selected} data-id={contact.Id}
                                    onclick={handleCheckboxClick}>
                                </lightning-input>
                            </div>

                            <!-- Avatar -->
                            <div class="contact-avatar">
                                <div class="avatar-initials">{contact.initials}</div>
                                <span class={contact.onlineClass}></span>
                            </div>

                            <!-- Contact Info -->
                            <div class="contact-info">
                                <div class="contact-name">{contact.Name}</div>
                                <div class={contact.messageClass}>
                                    {contact.lastMessage}
                                </div>
                            </div>

                            <!-- Time & Status -->
                            <div class="contact-meta">
                                <div class={contact.timeClass}>
                                    {contact.lastMessageTime}
                                </div>
                                <div class="unread-badge" if:true={contact.unreadCount}>
                                    {contact.unreadCount}
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:true={isLoading}>
                        <div class="loader">
                            <div class="spinner"></div>
                        </div>
                    </template>

                    <!-- No Contacts -->
                    <div if:true={noContacts} class="no-contacts">
                        <lightning-icon icon-name="utility:search" size="medium"></lightning-icon>
                        <p>No contacts found</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel - Chat Area -->
        <div class="chat-panel">
            <!-- Bulk Action Bar (when multiple selected) -->
            <div if:true={showBulkBar} class="bulk-action-bar">
                <div class="bulk-info">
                    <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                    <span>{selectedCount} selected</span>
                </div>
                <div class="bulk-actions">
                    <button class="bulk-send-btn" onclick={openBulkMessageModal} type="button">
                        <lightning-icon icon-name="utility:send" size="x-small"></lightning-icon>
                        Send Message
                    </button>
                    <button class="bulk-clear-btn" onclick={clearSelection} type="button">
                        Clear
                    </button>
                </div>
            </div>

            <!-- Chat Header (when single contact selected) -->
            <template if:true={selectedContact}>
                <div class="chat-header">
                    <div class="chat-contact-info">
                        <div class="contact-avatar-small">
                            <div class="avatar-initials-sm">{selectedContact.initials}</div>
                            <span class={selectedContactStatusClass}></span>
                        </div>
                        <div class="chat-contact-details">
                            <div class="chat-contact-name">{selectedContact.Name}</div>
                            <div class={chatStatusClass}>
                                {lastSeenLabel}
                            </div>
                        </div>
                    </div>

                    <div class="chat-actions">
                        <button class="icon-button" type="button" onclick={handleVideoCall} title="Video call">
                            <lightning-icon icon-name="utility:video" size="x-small"></lightning-icon>
                        </button>
                        <button class="icon-button" type="button" onclick={handleVoiceCall} title="Voice call">
                            <lightning-icon icon-name="utility:call" size="x-small"></lightning-icon>
                        </button>
                        <button class="icon-button" type="button" onclick={handleMenuClick} title="More">
                            <lightning-icon icon-name="utility:down" size="x-small"></lightning-icon>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Placeholder when no contact selected -->
            <template if:false={selectedContact}>
                <div class="chat-placeholder">
                    <div class="placeholder-content">
                        <lightning-icon icon-name="standard:whatsapp" size="large"></lightning-icon>
                        <h3>WhatsApp Business</h3>
                        <p>Select a contact to start chatting</p>

                        <button if:true={hasSelectedCount} class="bulk-start-btn" onclick={openBulkMessageModal}
                            type="button">
                            Send Message to {selectedCount} {bulkTargetLabel}
                        </button>
                    </div>
                </div>
            </template>

            <!-- Messages Area -->
            <div if:true={selectedContact} class="chat-body">
                <template for:each={messages} for:item="item">

                    <!-- DATE -->
                    <template if:true={item.isDate}>
                        <div key={item.Id} class="date-separator">
                            <span>{item.label}</span>
                        </div>
                    </template>

                    <!-- MESSAGE -->
                    <template if:true={item.isMessage}>
                        <div key={item.Id} class={item.cssClass}>
                            <div class="message-bubble">
                                <div class="message-text">
                                    {item.Message_Text__c}
                                </div>

                                <div class="message-meta">
                                    <span>{item.time}</span>
                                    <span class={item.statusClass}>{item.statusIcon}</span>
                                </div>
                            </div>
                        </div>
                    </template>

                </template>

                <template if:false={hasMessages}>
                    <div class="no-messages-placeholder">
                        <div class="empty-chat-card">
                            <div class="empty-icon">💬</div>
                            <div class="empty-title">No messages yet</div>
                            <div class="empty-subtitle">
                                Start the conversation by sending a message
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Message Input -->
            <div if:true={selectedContact} class="message-input-area">
                <button class="icon-button input-icon" type="button" onclick={handleEmojiClick} title="Emoji">
                    <lightning-icon icon-name="utility:emoji" size="x-small"></lightning-icon>
                </button>
                <button class="icon-button input-icon" type="button" title="Attach">
                    <lightning-icon icon-name="utility:attach" size="x-small"></lightning-icon>
                </button>

                <div class="input-wrapper">
                    <textarea placeholder="Type a message" value={newMessage} oninput={handleInput}
                        onkeydown={handleKeyDown} rows="1">
                    </textarea>
                </div>

                <button class="send-btn" onclick={handleSend} disabled={isSendDisabled} type="button">
                    <lightning-icon icon-name="utility:send" size="x-small"></lightning-icon>
                </button>
            </div>
        </div>

        <!-- Right Sidebar - Contact Info -->
        <template if:true={selectedContact}>
            <div class="info-panel">
                <!-- Profile -->
                <div class="info-profile">
                    <div class="info-avatar">
                        <div class="avatar-large-circle">
                            {selectedContact.initials}
                        </div>
                        <span class={profileOnlineClass}></span>
                    </div>

                    <div class="info-name">
                        {selectedContact.Name}
                    </div>

                    <div class={chatStatusClass}>
                        {lastSeenLabel}
                    </div>
                </div>

                <!-- Actions -->
                <div class="info-actions">
                    <button class="info-action" type="button">
                        <lightning-icon icon-name="utility:call" size="small"></lightning-icon>
                        <span>Call</span>
                    </button>

                    <button class="info-action" type="button">
                        <lightning-icon icon-name="utility:chat" size="small"></lightning-icon>
                        <span>Message</span>
                    </button>

                    <button class="info-action" type="button">
                        <lightning-icon icon-name="utility:threedots" size="small"></lightning-icon>
                        <span>More</span>
                    </button>
                </div>

                <!-- Contact Details -->
                <div class="info-section">
                    <div class="info-section-title">
                        Contact Information
                    </div>

                    <div class="info-item">
                        <span class="info-label">Phone</span>
                        <span class="info-value">{selectedContact.Phone}</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Name</span>
                        <span class="info-value">{selectedContact.Name}</span>
                    </div>
                </div>

                <!-- Media Section -->
                <div class="info-section">
                    <div class="info-section-title">
                        Media, Links and Docs
                    </div>

                    <div class="media-grid">
                        <div class="media-box"></div>
                        <div class="media-box"></div>
                        <div class="media-box"></div>
                        <div class="media-box"></div>
                        <div class="media-box"></div>
                        <div class="media-box"></div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Bulk Message Modal -->
    <template if:true={showModal}>
        <div class="modal-overlay" onclick={closeModal}>
            <div class="modal-container" onclick={stopPropagation}>
                <div class="modal-header">
                    <h3>Send Message to {selectedCount} Contacts</h3>
                    <button class="icon-button" type="button" onclick={closeModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                    </button>
                </div>

                <div class="modal-body">
                    <div class="selected-contacts-list">
                        <template for:each={selectedContactsList} for:item="contact">
                            <span key={contact.Id} class="selected-contact-chip">
                                {contact.Name}
                            </span>
                        </template>
                    </div>

                    <textarea class="bulk-message-input" placeholder="Type your message here..." value={bulkMessage}
                        onchange={handleBulkMessageChange}>
                    </textarea>
                </div>

                <div class="modal-footer">
                    <button class="modal-cancel-btn" onclick={closeModal} type="button">Cancel</button>
                    <button class="modal-send-btn" onclick={sendBulkMessage} type="button">
                        Send to All
                    </button>
                </div>
            </div>
        </div>
    </template>
</template>
