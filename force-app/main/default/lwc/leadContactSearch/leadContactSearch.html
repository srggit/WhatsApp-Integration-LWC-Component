<template>
    <lightning-card title="Search by Email">
        <div class="slds-m-around_medium">
            <lightning-input
                type="email"
                label="Email"
                value={email}
                onchange={handleEmailChange}>
            </lightning-input>
        </div>

        <template if:true={isLoading}>
            <div class="slds-m-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading" size="large" variant="brand" ></lightning-spinner>
            </div>
        </template>

        <template if:true={recordList.length}>
            <lightning-datatable
                key-field="recordId"
                data={recordList}
                columns={columns}
                hide-checkbox-column
                class="slds-m-around_medium">
            </lightning-datatable>
        </template>

        <template if:true={showCreatePrompt}>
            <p class="slds-text-color_weak slds-m-around_medium">
                No record found for the entered email.
            </p>
            <div class="slds-m-around_medium">
                <lightning-button 
                    label="Create New Lead" 
                    variant="brand" 
                    onclick={openCreateModal}>
                </lightning-button>
            </div>
        </template>

        <template if:true={showModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-modal__title">Create Lead</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input name="FirstName" label="First Name" onchange={handleFieldChange}></lightning-input>
                        <lightning-input name="LastName" label="Last Name" required onchange={handleFieldChange}></lightning-input>
                        <lightning-input name="Phone" label="Phone" onchange={handleFieldChange}></lightning-input>
                        <lightning-input name="Company" label="Company" required onchange={handleFieldChange}></lightning-input>
                        <lightning-combobox
                            name="Status"
                            label="Lead Status"
                            placeholder="Select"
                            options={leadStatusOptions}
                            onchange={handleFieldChange}>
                        </lightning-combobox>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button variant="brand" label="Create" onclick={handleCreateLead} class="slds-m-left_small"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
