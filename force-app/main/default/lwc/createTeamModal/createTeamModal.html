<template>
    <template if:true={isModalOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header custom-modal-header">
                    <h2 class="slds-modal__title">Create New Team</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isStepOne}>
                        <!-- STEP 1 -->
                        <div class="slds-grid slds-gutters slds-m-top_medium">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="Team Name" value={teamName} onchange={handleChange}
                                    data-id="teamName" required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="Region" value={region} onchange={handleChange} data-id="region"
                                    required></lightning-input>
                            </div>
                        </div>

                        <div class="slds-grid slds-gutters slds-m-top_medium">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="Available Budget" value={availableBudget}
                                    disabled></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input type="number" label="Budget Allocated" value={budgetAllotted}
                                    onchange={handleChange} data-id="budgetAllotted" required></lightning-input>
                            </div>
                        </div>

                        <div class="slds-grid slds-gutters slds-m-top_medium">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox label="Team Head" value={TeamHead} options={users}
                                    onchange={handleTeamHeadChange} required>
                                </lightning-combobox>


                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input type="number" label="No. of Members" value={NoOfMembers}
                                    data-id="NoOfMembers" onchange={handleChange} required>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-top_medium">
                            <div class="slds-col slds-size_1-of-1">
                                <lightning-input class="slds-m-top_medium" label="Fiscal Year" value={fiscalYear}
                                    disabled></lightning-input>
                            </div>

                        </div>
                        <div class="slds-grid slds-gutters slds-m-top_medium">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="Start Date" value={startDate} disabled></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="End Date" value={endDate} disabled></lightning-input>
                            </div>
                        </div>
                    </template>

                    <template if:false={isStepOne}>
                        <!-- STEP 2 -->
                        <div class="slds-grid slds-wrap slds-m-bottom_medium">
                            <div class="slds-col slds-size_1-of-2">
                                <p><strong>Team Name:</strong> {teamName}</p>

                                <p><strong>Start Date:</strong> {startDate}</p>

                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <p><strong>Budget Allocated:</strong>₹{budgetAllotted}</p>

                                <p><strong>End Date:</strong> {endDate}</p>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-top_medium">
                            <div class="slds-col slds-size_1-of-1">
                                <lightning-input label="Departmental Budget Name" value={departmentalBudgetName}
                                    onchange={handleChange} data-id="departmentalBudgetName" required></lightning-input>
                            </div>
                        </div>


                        <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                            <!-- Budget Objective -->
                            <div class="slds-col slds-size_1-of-2">
                                <div class="slds-form-element">
                                    <label class="slds-form-element__label" for="budgetObjective">
                                        Budget Objective <abbr class="slds-required" title="required">*</abbr>
                                    </label>
                                    <div class="slds-form-element__control">
                                        <lightning-input-rich-text data-id="budgetObjective" value={budgetObjective}
                                            onchange={handleChange} required class="slds-rich-text-editor_custom">
                                        </lightning-input-rich-text>
                                    </div>
                                </div>
                            </div>

                            <!-- Expected Outcome -->
                            <div class="slds-col slds-size_1-of-2">
                                <div class="slds-form-element">
                                    <label class="slds-form-element__label" for="expectedOutcome">
                                        Expected Outcome <abbr class="slds-required" title="required">*</abbr>
                                    </label>
                                    <div class="slds-form-element__control">
                                        <lightning-input-rich-text data-id="expectedOutcome" value={expectedOutcome}
                                            onchange={handleChange} required class="slds-rich-text-editor_custom">
                                        </lightning-input-rich-text>
                                    </div>
                                </div>
                            </div>
                        </div>


                        <div class="slds-m-top_large slds-text-heading_medium slds-border_bottom slds-p-bottom_x-small">
                            Yearly Calendar / Activity
                        </div>

                        <template for:each={activities} for:item="activity">
                            <div key={activity.key} class="slds-box slds-m-top_medium">
                                <!-- First Row: Compact Inputs -->
                                <!-- <div class="slds-grid slds-gutters">
                                    <div class="slds-col slds-size_1-of-4">
                                        <lightning-input label="Activity Name" value={activity.name} data-id="name"
                                            data-key={activity.key} onchange={handleActivityChange} required>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-4">
                                        <lightning-input label="Asked Budget" value={activity.budget} type="number"
                                            data-id="budget" data-key={activity.key} onchange={handleActivityChange}
                                            required>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-4">
                                        <lightning-input type="date" label="Tentative Date" value={activity.dates}
                                            data-id="dates" data-key={activity.key} onchange={handleActivityChange}
                                            required>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-4">
                                        <lightning-combobox label="Assign To" data-key={activity.key} options={users}
                                            value={activity.assignTo} onchange={handleAssignToChange} required>
                                        </lightning-combobox>
                                    </div>
                                </div> -->
                                <div class="slds-grid slds-gutters">
                                    <div class="slds-col slds-size_1-of-5">
                                        <lightning-input label="ActivityName" value={activity.name} data-id="name"
                                            data-key={activity.key} onchange={handleActivityChange} required>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5">
                                        <lightning-input label="AskedBudget" value={activity.budget} type="number"
                                            data-id="budget" data-key={activity.key} onchange={handleActivityChange}
                                            required>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5">
                                        <lightning-input type="number" label="ExpectedRevenue"
                                            value={activity.revenue} data-id="revenue" data-key={activity.key}
                                            onchange={handleActivityChange} required>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5">
                                        <lightning-input type="date" label="TentativeDate" value={activity.dates}
                                            data-id="dates" data-key={activity.key} onchange={handleActivityChange}
                                            required>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-5">
                                        <lightning-combobox label="AssignTo" data-key={activity.key} options={users}
                                            value={activity.assignTo} onchange={handleAssignToChange} required>
                                        </lightning-combobox>
                                    </div>
                                </div>


                                <!-- Second Row: Outcome as Full-Width Rich Text -->
                                <div class="slds-form-element">
                                    <label class="slds-form-element__label" for="outcomeInput">
                                        Outcome <abbr class="slds-required" title="required">*</abbr>
                                    </label>
                                    <div class="slds-form-element__control">
                                        <lightning-input-rich-text value={activity.outcome} data-id="outcome"
                                            data-key={activity.key} onchange={handleActivityChange}
                                            class="rich-text-custom">
                                        </lightning-input-rich-text>
                                    </div>
                                </div>


                                <!-- Remove Button -->
                                <div class="slds-m-top_small slds-align_right">
                                    <lightning-button-icon icon-name="utility:delete" alternative-text="Remove"
                                        title="Remove" variant="bare" data-key={activity.key} onclick={removeActivity}>
                                    </lightning-button-icon>
                                </div>
                            </div>
                        </template>


                        <lightning-button-icon icon-name="utility:add" variant="border-filled"
                            alternative-text="Add Activity" onclick={addActivity}
                            class="slds-m-top_small"></lightning-button-icon>

                    </template>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer custom-footer-bg slds-text-align_center">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                    <template if:true={isStepOne}>
                        <lightning-button variant="brand" label="Next" onclick={goToStepTwo}
                            class="slds-m-left_small"></lightning-button>
                    </template>
                    <template if:false={isStepOne}>
                        <lightning-button variant="neutral" label="Back" onclick={goToStepOne}
                            class="slds-m-left_small"></lightning-button>
                        <lightning-button variant="brand" label="Save and send for approval" onclick={handleSave}
                            class="slds-m-left_small"></lightning-button>
                    </template>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
