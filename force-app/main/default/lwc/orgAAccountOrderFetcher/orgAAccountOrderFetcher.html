<template>
    <lightning-card title="Account Orders from Org A" icon-name="standard:orders">
        <div class="slds-p-around_medium">
            <lightning-combobox
                name="accounts"
                label="Select Account"
                value={selectedAccountId}
                placeholder="Select an Account"
                options={accountOptions}
                onchange={handleAccountChange}>
            </lightning-combobox>
        </div>

        <template if:true={orders}>
            <lightning-datatable
                key-field="Name"
                data={orders}
                columns={columns}>
            </lightning-datatable>
        </template>

        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_small">{error}</div>
        </template>
    </lightning-card>
</template>
